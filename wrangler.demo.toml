# 「模擬資料」版 —— 給外人試用（Frank 等），裡面沒有任何真實客戶對話。
# 跟正式站同一份程式碼、同一個 Cloudflare 帳號，但 Worker 名稱、Durable Object、KV 都是自己的一套，互不相通。
#   部署：npx wrangler deploy --config wrangler.demo.toml
#   灌資料：node scripts/import_bundle.mjs data/mock_demo/bundle.json https://ai-command-center-demo.curry06240624.workers.dev --reset
#          node scripts/run_pipeline.mjs https://ai-command-center-demo.curry06240624.workers.dev --days=7
#   模擬資料重產（日期以今天為準）：MOCK_NOW=<ISO> MOCK_OUT=data/mock_demo node scripts/gen_mock.ts 20260907
#   秘密（各自設）：npx wrangler secret put SETUP_CODE --config wrangler.demo.toml；GEMINI_API_KEY 同

name = "ai-command-center-demo"
main = "src/index.js"
compatibility_date = "2026-06-24"

[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "APPDB"
class_name = "AppDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppDB"]

# 自己的 KV（不跟正式站共用，正式站的上傳檔不會漏到這裡）
[[kv_namespaces]]
binding = "DOCS"
id = "7d859fac53b74e5588bf9d1e5182791a"

[limits]
cpu_ms = 300000

[triggers]
crons = ["10 16 * * *"]

[vars]
DEMO_MODE = "on"   # 一鍵登入；這一站本來就是給人試的
