# Rayson 的測試站 —— 空的（沒有任何資料），給 Rayson 自己灌 LINE 匯出、獨立核對「數量對不對」用。
# 同一份程式碼、同帳號，自己的 Worker／Durable Object／KV。正式站＝ai-command-center（瑋瑋），模擬站＝-demo，Curry 測試站＝-curry。
#   部署：npx wrangler deploy --config wrangler.rayson.toml
#   秘密：npx wrangler secret put SETUP_CODE --config wrangler.rayson.toml；GEMINI_API_KEY 同

name = "ai-command-center-rayson"
main = "src/index.js"
compatibility_date = "2026-06-24"

[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "APPDB"
class_name = "AppDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppDB"]

[[kv_namespaces]]
binding = "DOCS"
id = "fcb9d49574e7403292d9d73bdc3519c2"

[limits]
cpu_ms = 300000

[triggers]
crons = ["10 16 * * *"]

[vars]
DEMO_MODE = "on"
