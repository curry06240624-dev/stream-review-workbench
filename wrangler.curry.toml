# Curry 的測試站 —— 2026-09-18 起是「只有 8 月資料」版：LINE 對話／成交群／接待組／估車群／Super 8 發送者全部只留 2026/08/01–08/31（台灣時間），
# 跟 Frank／黎手上的 Super 8 8 月匯出等價，人工判讀與數字核對用。做法見 docs/DATA_FLOW.md「只留一個月的測試站」。不動正式站。
# 同一份程式碼、同帳號，自己的 Worker／Durable Object／KV。正式站＝ai-command-center（瑋瑋），模擬站＝-demo，Frank 測試站＝-frank。
#   部署：npx wrangler deploy --config wrangler.curry.toml
#   秘密：npx wrangler secret put SETUP_CODE --config wrangler.curry.toml；GEMINI_API_KEY 同

name = "ai-command-center-curry"
main = "src/index.js"
compatibility_date = "2026-06-24"

[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "APPDB"
class_name = "AppDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppDB"]

[[kv_namespaces]]
binding = "DOCS"
id = "bc773ec57f5c4557a989e4e7ab4544ed"

[limits]
cpu_ms = 300000

[triggers]
crons = ["10 16 * * *"]

[vars]
DEMO_MODE = "on"
FIXED_PERIOD = "2026-08"   # 只有這個月的資料：期間鎖整個月（畫面沒有 7/14/30），沒有前期可比
