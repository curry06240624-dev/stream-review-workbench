<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>新增直播｜直播覆盤工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>新增直播</h1><div class="sub"><a class="plain" href="index.html">← 回列表</a></div></div>
    <span class="sp"></span><span class="who" id="who"></span>
  </header>

  <div class="card">
    <div class="row2">
      <div><label for="streamer">直播主</label><input id="streamer" maxlength="40" placeholder="例如：小李"></div>
      <div><label for="live_date">直播日期</label><input id="live_date" type="date"></div>
    </div>

    <label>直播數據（沒有的先填 0，之後可以補）</label>
    <div class="row4">
      <div><label for="viewers_total">總觀看數</label><input id="viewers_total" type="number" min="0" value="0"></div>
      <div><label for="peak_viewers">在線峰值</label><input id="peak_viewers" type="number" min="0" value="0"></div>
      <div><label for="comments">留言數</label><input id="comments" type="number" min="0" value="0"></div>
      <div><label for="inquiries">詢單數</label><input id="inquiries" type="number" min="0" value="0"></div>
    </div>

    <label for="transcript">逐字稿（整段貼上，最好含時間標記）</label>
    <textarea id="transcript" placeholder="[00:00:12] 主播：大家晚安…&#10;[00:00:40] 留言：這台幾年的？"></textarea>

    <div class="err" id="err"></div>
    <div class="loading" id="loading">AI 覆盤中… 通常 10–30 秒，不要關掉這一頁。</div>
    <div style="margin-top:16px"><button class="btn" id="go">送出並覆盤</button></div>
  </div>
</div>

<script src="app.js"></script>
<script>
(async () => {
  if (!await requireLogin()) return;
  document.getElementById("live_date").value = new Date().toISOString().slice(0, 10);
  autoGrow(document.getElementById("transcript"));

  document.getElementById("go").addEventListener("click", async () => {
    showErr("");
    const btn = document.getElementById("go");
    const body = {
      streamer: document.getElementById("streamer").value.trim(),
      live_date: document.getElementById("live_date").value,
      transcript: document.getElementById("transcript").value,
      metrics: {
        viewers_total: document.getElementById("viewers_total").value,
        peak_viewers: document.getElementById("peak_viewers").value,
        comments: document.getElementById("comments").value,
        inquiries: document.getElementById("inquiries").value,
      },
    };
    btn.disabled = true;
    document.getElementById("loading").classList.add("on");
    const j = await api("/api/livestreams", body);
    document.getElementById("loading").classList.remove("on");
    btn.disabled = false;
    if (j.ok) { location.href = "review.html?id=" + j.review_id; return; }
    showErr(j.message || "送出失敗，再試一次。");
  });
})();
</script>
</body>
</html>
