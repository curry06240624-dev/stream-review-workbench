<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登入｜AI 指揮中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .wrap{max-width:560px; padding-top:7vh}
  .who-list{display:flex; flex-direction:column; gap:10px; margin-top:4px}
  .who-btn{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--panel-2); border:1px solid var(--rule);
    padding:14px 16px; color:var(--ink); font:inherit; cursor:pointer;
    border-left:2px solid var(--rule);
  }
  .who-btn:hover{border-color:var(--accent); border-left-color:var(--accent); background:var(--panel)}
  .who-btn .av{
    width:34px; height:34px; flex:none; display:grid; place-items:center;
    font-weight:600; font-size:14px; background:var(--cyan-soft); color:var(--cyan);
    border:1px solid var(--cyan-3); font-family:var(--mono);
  }
  .who-btn.agent .av{background:transparent; color:var(--faint); border-color:var(--rule)}
  .who-btn b{display:block; font-size:15px}
  .who-btn small{color:var(--dim); font-size:12.5px}
  .altlink{margin-top:18px; font-size:12.5px; color:var(--faint); text-align:center}
  .altlink a{color:var(--dim)}
  #pwform{display:none; margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2 style="margin-bottom:6px"><span style="color:var(--accent)">◤</span> AI 指揮中心</h2>

    <div id="demobox" style="display:none">
      <p style="color:var(--dim); font-size:13px; margin:0 0 14px">
        示範環境。選一個身分進去，看到的東西會不一樣 ——
        權限是伺服器擋的，不是畫面藏的。
      </p>
      <div class="who-list" id="whos"></div>
      <div class="altlink"><a href="#" id="toform">用帳號密碼登入</a></div>
    </div>

    <div id="pwform">
      <label for="email">電子郵件</label>
      <input id="email" type="email" autocomplete="email">
      <label for="pw">密碼</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div style="margin-top:16px"><button class="btn" id="go" style="width:100%">登入</button></div>
    </div>

    <div class="err" id="err"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
const ROLES = [
  { email: "boss@test.local",     name: "老闆",       ini: "闆", desc: "管理者・看得到全部對話與所有人的戰況" },
  { email: "operator@test.local", name: "阿哲",       ini: "哲", desc: "運營・看得到全部，負責把對話指派出去" },
  { email: "agent1@test.local",   name: "小婷",       ini: "婷", desc: "訊息手・只看得到指派給她的", agent: 1 },
  { email: "agent2@test.local",   name: "阿凱",       ini: "凱", desc: "訊息手・只看得到指派給他的", agent: 1 },
];

(async () => {
  const me = await api("/api/me");
  if (me.needsSetup) { location.href = "setup.html"; return; }
  if (me.user) { location.href = "index.html"; return; }

  if (me.demo) {
    document.getElementById("demobox").style.display = "";
    document.getElementById("whos").innerHTML = ROLES.map((r) =>
      '<button class="who-btn' + (r.agent ? " agent" : "") + '" data-em="' + r.email + '">'
      + '<span class="av">' + r.ini + "</span>"
      + "<span><b>" + r.name + "</b><small>" + r.desc + "</small></span></button>").join("");
    document.querySelectorAll(".who-btn").forEach((b) => b.addEventListener("click", async () => {
      showErr("");
      b.disabled = true;
      const j = await api("/api/demo-login", { email: b.dataset.em });
      if (j.ok) { location.href = "index.html"; return; }
      b.disabled = false;
      showErr(j.message || "進不去，換一個試試。");
    }));
    document.getElementById("toform").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("demobox").style.display = "none";
      document.getElementById("pwform").style.display = "block";
    });
  } else {
    document.getElementById("pwform").style.display = "block";
  }

  const go = async () => {
    showErr("");
    const j = await api("/api/login", {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("pw").value,
    });
    if (j.ok) { location.href = "index.html"; return; }
    showErr(j.message || "登入失敗");
  };
  document.getElementById("go").addEventListener("click", go);
  document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
})();
</script>
</body>
</html>
