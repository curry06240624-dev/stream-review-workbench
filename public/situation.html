<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>現場狀況｜AI 指揮中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="app">
<div class="side" id="side"></div>

<div class="main">
<div class="wrap">
  <header class="top">
    <div>
      <h1>現場狀況</h1>
      <div class="sub" id="sub">依等待時間排序</div>
    </div>
    <span class="sp"></span>
    <span class="who" id="clock"></span>
    <button class="btn ghost sm" id="refresh">重新整理</button>
  </header>

  <!-- 這一條是整頁的結論：現在到底要不要有人動作 -->
  <div id="verdict"></div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>等待回覆的對話</h2>
    <p class="hint" id="qhint"></p>
    <div id="queue"></div>
  </div>

  <div class="card" id="loadcard" style="display:none">
    <h2>人員負載</h2>
    <table class="list">
      <thead><tr><th>成員</th><th class="num">負責</th><th class="num">等待中</th><th class="num">最久</th><th>狀態</th></tr></thead>
      <tbody id="loadrows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>事件流</h2>
    <div id="events"></div>
  </div>

  <p class="foot">
    「等待中」的定義：這通對話的最後一則是客人講的，還沒有人回。<br>
    第一階段：全部使用假資料，不連接公司任何正式系統，不使用 LINE API。
  </p>
</div>
</div>

<script src="app.js"></script>
<script>
let ME = null, TH = { warn: 60, bad: 240 };

const mmss = (m) => m == null ? "—"
  : m < 60 ? m + " 分"
  : m < 1440 ? Math.floor(m / 60) + " 小時 " + (m % 60) + " 分"
  : Math.floor(m / 1440) + " 天";

const level = (m) => m >= TH.bad ? "bad" : m >= TH.warn ? "warn" : "ok";

(async () => {
  ME = await requireLogin();
  if (!ME) return;
  document.getElementById("refresh").addEventListener("click", load);
  await load();
  // 指揮中心要是活的：每 30 秒自己更新一次，並把上次更新時間寫在畫面上，
  // 否則看的人不知道自己在看多久以前的東西。
  setInterval(load, 30000);
})();

async function load() {
  const j = await api("/api/situation");
  if (!j.ok) return;
  TH = j.thresholds;
  renderSidebar(ME, "situation.html", { waiting: j.stats.waiting });
  document.getElementById("clock").textContent =
    "更新於 " + new Date(j.now).toTimeString().slice(0, 8);
  if (!j.can_see_all) document.getElementById("sub").textContent = "只顯示指派給你的對話";

  const s = j.stats;

  // 結論列：一句話講完現在的狀態，顏色跟著狀態走
  const v = document.getElementById("verdict");
  if (s.waiting === 0) {
    v.className = "verdict ok";
    v.textContent = "沒有人在等回覆。";
  } else if (s.over_warn > 0) {
    v.className = "verdict warn";
    v.innerHTML = "<b>" + s.over_warn + "</b> 通已經超過 " + TH.warn
      + " 分鐘沒有回覆，最久的等了 <b>" + mmss(s.longest_min) + "</b>。";
  } else {
    v.className = "verdict ok";
    v.innerHTML = s.waiting + " 通在等回覆，都還在 " + TH.warn + " 分鐘內。";
  }

  document.getElementById("tiles").innerHTML =
    tile(s.waiting, "等待回覆", s.waiting > 0 ? "hi" : "ok")
    + tile(s.unassigned, "其中未指派", s.unassigned > 0 ? "hi" : "")
    + tile(mmss(s.longest_min), "最久等待", s.longest_min >= TH.warn ? "hi" : "")
    + tile(s.incoming_24h + " / " + s.outgoing_24h, "24 小時 進 / 出");

  // 佇列：等待時間長條 —— 相對於最久的那通，一眼看出誰最急
  const worst = Math.max(s.longest_min, 1);
  document.getElementById("qhint").textContent =
    j.waiting.length ? "等最久的排最前面，直接點進去回覆。" : "";
  document.getElementById("queue").innerHTML = j.waiting.length
    ? j.waiting.map((w) => {
        const lv = level(w.wait_min);
        return '<a class="q ' + lv + '" href="inbox.html">'
          + '<span class="gr g-' + esc(w.grade) + '">' + esc(w.grade) + "</span>"
          + '<span class="qmain"><b>' + esc(w.name) + "</b>"
          + '<small>' + esc(w.last_text || "") + "</small></span>"
          + '<span class="qwho">' + (w.assigned_to ? esc(w.agent_name)
              : '<i class="unassigned">未指派</i>') + "</span>"
          + '<span class="qbar"><i style="width:'
              + Math.max(3, Math.round(w.wait_min / worst * 100)) + '%"></i></span>'
          + '<span class="qmin">' + mmss(w.wait_min) + "</span></a>";
      }).join("")
    : '<p class="empty">目前沒有對話在等回覆。</p>';

  if (j.can_see_all && j.load.length) {
    document.getElementById("loadcard").style.display = "";
    document.getElementById("loadrows").innerHTML = j.load.map((a) => {
      const lv = a.longest_min >= TH.bad ? "bad" : a.longest_min >= TH.warn ? "warn" : "ok";
      const state = a.waiting === 0 ? "無待辦"
        : lv === "ok" ? "跟得上" : lv === "warn" ? "該回了" : "壓住了";
      return "<tr><td><b>" + esc(a.name) + "</b> "
        + '<span class="role">' + (a.role === "operator" ? "運營" : "訊息手") + "</span></td>"
        + '<td class="num">' + a.assigned + "</td>"
        + '<td class="num' + (a.waiting > 0 ? " hi" : "") + '">' + a.waiting + "</td>"
        + '<td class="num">' + (a.longest_min ? mmss(a.longest_min) : "—") + "</td>"
        + '<td><span class="state ' + lv + '">' + state + "</span></td></tr>";
    }).join("");
  }

  document.getElementById("events").innerHTML = j.events.length
    ? j.events.map((e) => {
        const K = { in: "客人來訊", out: "我方回覆", assign: "指派" };
        return '<div class="ev ' + e.kind + '">'
          + '<span class="evt">' + mmss(e.ago) + "前</span>"
          + '<span class="evk">' + K[e.kind] + "</span>"
          + "<b>" + esc(e.contact) + "</b>"
          + '<span class="evx">' + esc(e.text) + "</span>"
          + (e.who ? '<span class="evw">' + esc(e.who) + "</span>" : "") + "</div>";
      }).join("")
    : '<p class="empty">還沒有事件。</p>';
}

function tile(n, label, cls) {
  // 純數字用大字級，帶單位的（「9 小時 49 分」）用小一號，不然會撐到換行
  const txt = /[^\d]/.test(String(n)) ? " txt" : "";
  return '<div class="tile"><span class="n ' + (cls || "") + txt + '">' + n
    + '</span><span class="l">' + label + "</span></div>";
}
</script>
</body>
</html>
