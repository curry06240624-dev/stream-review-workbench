<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>現場狀況｜AI 指揮中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="app">
<div class="side" id="side"></div>

<div class="main">
<div class="wrap">
  <header class="top">
    <div>
      <h1>現場狀況</h1>
      <div class="sub" id="sub">依等待時間排序</div>
    </div>
    <span class="sp"></span>
    <span class="who" id="clock"></span>
    <a class="btn ghost sm" href="wall.html" target="_blank" style="text-decoration:none">牆上大螢幕</a>
    <button class="btn ghost sm" id="refresh">重新整理</button>
  </header>

  <!-- 整頁的結論：現在到底要不要有人動作 -->
  <div id="verdict"></div>
  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>等待回覆的對話</h2>
    <p class="hint" id="qhint"></p>
    <div id="queue"></div>
  </div>

  <!-- ③ 預測層：這一段回答「接下來會變好還是變壞」 -->
  <div class="card" id="covcard" style="display:none">
    <h2>自動回覆能接住的</h2>
    <div id="coverage"></div>
  </div>

  <div class="card">
    <h2>積壓趨勢 ・ 過去 12 小時</h2>
    <div id="trendverdict"></div>
    <div class="chart" id="trend"></div>
    <p class="foot" style="margin-top:12px;border:0;padding:0">
      柱高＝該小時的訊息量，青＝客人進線、灰＝我方回覆。
      這是用「進線減回覆」推估積壓的方向，不是重建歷史佇列長度 —— 看趨勢，別看絕對值。
    </p>
  </div>

  <div class="card" id="peakcard" style="display:none">
    <h2>尖峰時段 ・ <span id="peakdays"></span></h2>
    <div class="chart hours" id="peak"></div>
    <p class="foot" style="margin-top:12px;border:0;padding:0" id="peaktext"></p>
  </div>

  <div class="card" id="loadcard" style="display:none">
    <h2>人員負載</h2>
    <table class="list">
      <thead><tr><th>成員</th><th class="num">負責</th><th class="num">等待中</th><th class="num">最久</th><th>狀態</th></tr></thead>
      <tbody id="loadrows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>事件流</h2>
    <div id="events"></div>
  </div>

  <p class="foot">
    「等待中」＝這通對話的最後一則是客人講的，還沒有人回。<span id="slafoot"></span><br>
    第一階段：全部使用假資料，不連接公司任何正式系統，不使用 LINE API。
  </p>
</div>
</div>

<script src="app.js"></script>
<script>
let ME = null, TH = { warn: 30, bad: 120 };

const mmss = (m) => m == null ? "—"
  : m < 60 ? m + " 分"
  : m < 1440 ? Math.floor(m / 60) + " 小時 " + (m % 60) + " 分"
  : Math.floor(m / 1440) + " 天";
const level = (m) => m >= TH.bad ? "bad" : m >= TH.warn ? "warn" : "ok";

(async () => {
  ME = await requireLogin();
  if (!ME) return;
  document.getElementById("refresh").addEventListener("click", load);
  await load();
  setInterval(load, 30000);
})();

async function load() {
  const j = await api("/api/situation");
  if (!j.ok) return;
  TH = j.thresholds;
  renderSidebar(ME, "situation.html", { waiting: j.stats.waiting });
  document.getElementById("clock").textContent =
    "更新於 " + new Date(j.now).toTimeString().slice(0, 8);
  if (!j.can_see_all) document.getElementById("sub").textContent = "只顯示指派給你的對話";
  document.getElementById("slafoot").textContent =
    "　目標：" + j.sla.target_min + " 分鐘內回覆。";

  const s = j.stats;

  /* ② 理解：一句話講完現在的狀態 */
  const v = document.getElementById("verdict");
  if (s.waiting === 0) {
    v.className = "verdict ok";
    v.textContent = "沒有人在等回覆。";
  } else if (j.sla.breached > 0) {
    v.className = "verdict warn";
    v.innerHTML = "<b>" + j.sla.breached + "</b> 通已經超過目標 "
      + j.sla.target_min + " 分鐘沒回覆，最久的等了 <b>" + mmss(s.longest_min) + "</b>。";
  } else {
    v.className = "verdict ok";
    v.innerHTML = s.waiting + " 通在等回覆，都還在目標 " + j.sla.target_min + " 分鐘內。";
  }

  document.getElementById("tiles").innerHTML =
    tile(s.waiting, "等待回覆", s.waiting > 0 ? "hi" : "ok")
    + tile(j.sla.breached, "超過目標 " + j.sla.target_min + " 分", j.sla.breached > 0 ? "hi" : "")
    + tile(mmss(s.longest_min), "最久等待", s.longest_min >= TH.warn ? "hi" : "")
    + tile(j.burn.hours_to_clear == null ? "—" : j.burn.hours_to_clear + " 小時", "預估清完")
    + tile(s.frt_median == null ? "—" : mmss(s.frt_median), "首覆中位數");

  /* ① 感知：佇列 */
  const worst = Math.max(s.longest_min, 1);
  document.getElementById("qhint").textContent =
    j.waiting.length ? "等最久的排最前面，直接點進去回覆。" : "";
  document.getElementById("queue").innerHTML = j.waiting.length
    ? j.waiting.map((w) => {
        const lv = level(w.wait_min);
        return '<a class="q ' + lv + '" href="inbox.html">'
          + '<span class="gr g-' + esc(w.grade) + '">' + esc(w.grade) + "</span>"
          + '<span class="qmain"><b>' + esc(w.name) + "</b>"
          + '<small>' + esc(w.last_text || "") + "</small></span>"
          + '<span class="qwho">' + (w.assigned_to ? esc(w.agent_name)
              : '<i class="unassigned">未指派</i>') + "</span>"
          + '<span class="qbar"><i style="width:'
              + Math.max(3, Math.round(w.wait_min / worst * 100)) + '%"></i></span>'
          + '<span class="qmin">' + mmss(w.wait_min) + "</span></a>";
      }).join("")
    : '<p class="empty">目前沒有對話在等回覆。</p>';

  /* 自動回覆覆蓋率：把「要不要開自動回覆」從感覺之爭變成一個數字 */
  if (j.coverage && j.coverage.covered > 0) {
    document.getElementById("covcard").style.display = "";
    document.getElementById("coverage").innerHTML =
      '<div class="tverdict"><b>' + j.coverage.covered + " / " + s.waiting + " 通</b>"
      + "現在等待中的對話，已有規則接得住 —— 這些不用佔用訊息手。</div>"
      + j.coverage.samples.map((x) =>
          '<div class="covrow"><b>' + esc(x.name) + "</b>"
          + '<span class="arrow">→</span><span class="rule">' + esc(x.rule) + "</span></div>").join("")
      + '<p class="foot" style="margin-top:12px;border:0;padding:0">'
      + "規則只在真人 10 分鐘內沒回過、且同規則 24 小時內沒回過時才會出手 ——"
      + "不插嘴、不重複，這兩條是自動回覆會不會惹禍的關鍵。</p>";
  } else {
    document.getElementById("covcard").style.display = "none";
  }

  /* ③ 預測 A：積壓趨勢 */
  const TV = {
    worse: ["warn", "正在變壞", "進來的比回出去的多，積壓在增加。"],
    better: ["ok", "正在變好", "回出去的比進來的多，積壓在消。"],
    flat: ["ok", "持平", "進出大致打平。"],
  }[j.trend];
  document.getElementById("trendverdict").innerHTML =
    '<div class="tverdict ' + TV[0] + '"><b>' + TV[1] + "</b>" + TV[2] + "</div>";
  const hmax = Math.max(1, ...j.hourly.map((h) => Math.max(h.incoming, h.outgoing)));
  document.getElementById("trend").innerHTML = j.hourly.map((h) =>
    '<div class="col" title="' + h.hour + '時　進 ' + h.incoming + '／出 ' + h.outgoing + '">'
    + '<span class="bars">'
    + '<i class="bin"  style="height:' + (h.incoming / hmax * 100) + '%"></i>'
    + '<i class="bout" style="height:' + (h.outgoing / hmax * 100) + '%"></i></span>'
    + '<span class="xl">' + String(h.hour).padStart(2, "0") + "</span></div>").join("");

  /* ③ 預測 B：尖峰時段 —— 資料不足時後端回 null，這裡整張卡片就不出現 */
  if (j.peak) {
    document.getElementById("peakcard").style.display = "";
    document.getElementById("peakdays").textContent = "近 " + j.data_days + " 天";
    const pmax = Math.max(1, ...j.peak.map((p) => p.n));
    const top = [...j.peak].sort((a, b) => b.n - a.n).slice(0, 3);
    document.getElementById("peak").innerHTML = j.peak.map((p) =>
      '<div class="col' + (top.some((t) => t.hour === p.hour) ? " top" : "")
      + '" title="' + p.hour + '時　' + p.n + ' 則">'
      + '<span class="bars"><i class="bin" style="height:' + (p.n / pmax * 100) + '%"></i></span>'
      + '<span class="xl">' + (p.hour % 3 === 0 ? String(p.hour).padStart(2, "0") : "")
      + "</span></div>").join("");
    document.getElementById("peaktext").textContent =
      "最忙的是 " + top.map((t) => t.hour + " 點").join("、")
      + "（台灣時間）。人力要排在這幾個時段，不是平均分配。";
  }

  /* 人員負載 */
  if (j.can_see_all && j.load.length) {
    document.getElementById("loadcard").style.display = "";
    document.getElementById("loadrows").innerHTML = j.load.map((a) => {
      const lv = a.longest_min >= TH.bad ? "bad" : a.longest_min >= TH.warn ? "warn" : "ok";
      const state = a.waiting === 0 ? "無待辦"
        : lv === "ok" ? "跟得上" : lv === "warn" ? "該回了" : "壓住了";
      return "<tr><td><b>" + esc(a.name) + "</b> "
        + '<span class="role">' + (a.role === "operator" ? "運營" : "訊息手") + "</span></td>"
        + '<td class="num">' + a.assigned + "</td>"
        + '<td class="num' + (a.waiting > 0 ? " hi" : "") + '">' + a.waiting + "</td>"
        + '<td class="num">' + (a.longest_min ? mmss(a.longest_min) : "—") + "</td>"
        + '<td><span class="state ' + lv + '">' + state + "</span></td></tr>";
    }).join("");
  }

  document.getElementById("events").innerHTML = j.events.length
    ? j.events.map((e) => {
        const K = { in: "客人來訊", out: "我方回覆", assign: "指派" };
        return '<div class="ev ' + e.kind + '">'
          + '<span class="evt">' + mmss(e.ago) + "前</span>"
          + '<span class="evk">' + K[e.kind] + "</span>"
          + "<b>" + esc(e.contact) + "</b>"
          + '<span class="evx">' + esc(e.text) + "</span>"
          + (e.who ? '<span class="evw">' + esc(e.who) + "</span>" : "") + "</div>";
      }).join("")
    : '<p class="empty">還沒有事件。</p>';
}

function tile(n, label, cls) {
  // 純數字用大字級，帶單位的（「9 小時 49 分」）用小一號，不然會撐到換行
  const txt = /[^\d]/.test(String(n)) ? " txt" : "";
  return '<div class="tile"><span class="n ' + (cls || "") + txt + '">' + n
    + '</span><span class="l">' + label + "</span></div>";
}
</script>
</body>
</html>
