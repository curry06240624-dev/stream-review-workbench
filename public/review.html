<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>覆盤結果｜直播覆盤工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>覆盤結果</h1><div class="sub"><a class="plain" href="index.html">← 回列表</a></div></div>
    <span class="sp"></span><span class="who" id="who"></span>
  </header>

  <div class="card" id="head"><h2>載入中…</h2></div>

  <div class="card">
    <h2>本場最大的問題 <span class="badge" id="pcount"></span></h2>
    <div id="problems"></div>
  </div>

  <div class="card">
    <h2>下一場要改善的事</h2>
    <div id="actions"></div>
    <div style="margin-top:16px"><button class="btn ghost sm" id="copy">複製成 LINE 訊息</button></div>
  </div>

  <p class="foot">
    引用段落是伺服器逐字核對過的；標紅的代表 AI 給的出處對不上原文，那一條要特別用人工判斷。<br>
    「運營修改與確認」在第二階段開放 —— 資料欄位已就緒。
  </p>
</div>

<script src="app.js"></script>
<script>
(async () => {
  if (!await requireLogin()) return;
  const id = new URLSearchParams(location.search).get("id");
  const j = await api("/api/reviews/" + id);
  if (!j.ok) { document.getElementById("head").innerHTML = "<h2>" + esc(j.message || "找不到這份覆盤") + "</h2>"; return; }

  let m = {};
  try { m = JSON.parse(j.review.metrics_json); } catch (e) {}
  document.getElementById("head").innerHTML =
    "<h2>" + esc(j.review.streamer) + "　" + esc(j.review.live_date) + "</h2>"
    + '<div class="metrics">'
    + "<span>總觀看 <b>" + (m.viewers_total ?? "–") + "</b></span>"
    + "<span>在線峰值 <b>" + (m.peak_viewers ?? "–") + "</b></span>"
    + "<span>留言 <b>" + (m.comments ?? "–") + "</b></span>"
    + "<span>詢單 <b>" + (m.inquiries ?? "–") + "</b></span>"
    + "<span>模型 <b>" + esc(j.review.model) + "</b></span></div>"
    + (j.review.notes ? '<p style="margin:12px 0 0;color:var(--dim)">' + esc(j.review.notes) + "</p>" : "");

  const probs = j.items.filter((x) => x.kind === "problem");
  const acts  = j.items.filter((x) => x.kind === "action");
  document.getElementById("pcount").textContent = probs.length + " 個";

  document.getElementById("problems").innerHTML = probs.length ? probs.map((p) =>
    '<div class="item"><span class="k">問題 ' + p.seq + "</span>　"
    + '<span class="badge' + (p.severity === "重大" ? "" : " warn") + '">' + esc(p.severity || "中") + "</span>"
    + "<p>" + esc(p.ai_text) + "</p>"
    + '<div class="quote' + (p.quote_ok ? "" : " badq") + '">「' + esc(p.quote) + "」"
    + '<span class="pos">　約 ' + esc(p.quote_pos || "?") + (p.quote_ok ? "" : "　⚠ 出處對不上原文，請人工確認") + "</span></div></div>"
  ).join("") : '<p style="color:var(--faint)">AI 認為本場沒有重大問題。</p>';

  document.getElementById("actions").innerHTML = acts.map((a) =>
    '<div class="item action"><span class="k">任務 ' + a.seq + "</span>"
    + "<p>" + esc(a.ai_text) + "</p>"
    + '<div class="crit">驗收標準：<b>' + esc(a.success_criteria || "（未提供）") + "</b></div></div>"
  ).join("");

  document.getElementById("copy").addEventListener("click", () => {
    const L = ["【" + j.review.streamer + " " + j.review.live_date + " 直播覆盤】", ""];
    probs.forEach((p) => L.push("問題" + p.seq + "：" + p.ai_text));
    L.push("");
    acts.forEach((a) => L.push("下一場任務" + a.seq + "：" + a.ai_text + "（標準：" + a.success_criteria + "）"));
    const text = L.join("\n");
    const done = () => {
      document.getElementById("copy").textContent = "已複製 ✓";
      setTimeout(() => document.getElementById("copy").textContent = "複製成 LINE 訊息", 1600);
    };
    // clipboard API 在沒有權限的環境會靜靜失敗（實測過）—— 失敗就退回選字複製
    navigator.clipboard.writeText(text).then(done).catch(() => {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { alert(text); }
      ta.remove();
    });
  });
})();
</script>
</body>
</html>
