<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>直播 AI 指揮中心</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="mk">◤</span>直播 AI 指揮中心</h1>
      <div class="sub">COMMAND CENTER ・ 覆盤模組 v1</div>
    </div>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <a class="btn sm" href="new.html" style="text-decoration:none">＋ 分析新直播</a>
    <button class="btn ghost sm" onclick="logout()">登出</button>
  </header>

  <!-- 戰情磚：全部是資料庫真算出來的 -->
  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>問題嚴重度分布</h2>
    <div id="sevwrap"><p class="empty">尚無資料</p></div>
  </div>

  <div class="card">
    <h2>直播主戰況</h2>
    <table class="list">
      <thead><tr><th>直播主</th><th class="num">場次</th><th>最近直播</th><th class="num">累計觀看</th><th class="num">累計詢單</th><th class="num">重大問題</th><th>最新覆盤</th></tr></thead>
      <tbody id="strows"><tr><td colspan="7" class="empty">載入中…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>最近場次</h2>
    <table class="list">
      <thead><tr><th>日期</th><th>直播主</th><th class="num">觀看</th><th class="num">峰值</th><th class="num">詢單</th><th>覆盤</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">載入中…</td></tr></tbody>
    </table>
  </div>

  <p class="foot">
    第一階段：全部使用假資料，不連接任何正式系統。<br>
    AI 覆盤的每一條問題都附逐字稿原文出處並經伺服器逐字核對 —— 出處對不上的會標示，請以人的判斷為準。
  </p>
</div>

<script src="app.js"></script>
<script>
(async () => {
  if (!await requireLogin()) return;
  const j = await api("/api/dashboard");
  if (!j.ok) { document.getElementById("strows").innerHTML = '<tr><td colspan="7">' + esc(j.message || "載入失敗") + "</td></tr>"; return; }

  const t = j.totals;
  document.getElementById("tiles").innerHTML =
    tile(t.streams, "已分析場次") +
    tile(t.problems, "AI 找出的問題") +
    tile(t.sev["重大"], "重大問題", t.sev["重大"] > 0 ? "hi" : "") +
    tile(t.quote_rate === null ? "–" : t.quote_rate + "%", "引用通過逐字核對", "ok");

  if (t.problems > 0) {
    const w = (n) => Math.round(n / t.problems * 100);
    document.getElementById("sevwrap").innerHTML =
      '<div class="sevbar">'
      + '<i class="s-hi" style="width:' + w(t.sev["重大"]) + '%"></i>'
      + '<i class="s-mid" style="width:' + w(t.sev["中"]) + '%"></i>'
      + '<i class="s-low" style="width:' + w(t.sev["輕微"]) + '%"></i></div>'
      + '<div class="sevkey"><span class="k-hi">■ 重大 <b>' + t.sev["重大"] + "</b></span>"
      + '<span class="k-mid">■ 中 <b>' + t.sev["中"] + "</b></span>"
      + '<span class="k-low">■ 輕微 <b>' + t.sev["輕微"] + "</b></span></div>";
  }

  document.getElementById("strows").innerHTML = j.streamers.length ? j.streamers.map((s) =>
    "<tr><td><b>" + esc(s.streamer) + "</b></td>"
    + '<td class="num">' + s.count + "</td><td>" + esc(s.last) + "</td>"
    + '<td class="num">' + s.viewers.toLocaleString() + '</td><td class="num">' + s.inquiries + "</td>"
    + '<td class="num' + (s.hi > 0 ? " hi" : "") + '">' + s.hi + "</td>"
    + "<td>" + (s.last_review ? '<a href="review.html?id=' + s.last_review + '">開啟 →</a>' : "–") + "</td></tr>"
  ).join("") : '<tr><td colspan="7" class="empty">還沒有資料 —— 按右上「分析新直播」貼第一場逐字稿。</td></tr>';

  document.getElementById("rows").innerHTML = j.recent.length ? j.recent.map((l) => {
    let m = {};
    try { m = JSON.parse(l.metrics_json); } catch (e) {}
    return "<tr><td>" + esc(l.live_date) + "</td><td>" + esc(l.streamer) + "</td>"
      + '<td class="num">' + (m.viewers_total ?? "–") + '</td><td class="num">' + (m.peak_viewers ?? "–")
      + '</td><td class="num">' + (m.inquiries ?? "–") + "</td>"
      + "<td>" + (l.review_id ? '<a href="review.html?id=' + l.review_id + '">看覆盤 →</a>' : "–") + "</td></tr>";
  }).join("") : '<tr><td colspan="6" class="empty">還沒有場次。</td></tr>';

  function tile(n, label, cls) {
    return '<div class="tile"><span class="n ' + (cls || "") + '">' + n + '</span><span class="l">' + label + "</span></div>";
  }
})();
</script>
</body>
</html>
