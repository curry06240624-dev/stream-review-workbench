<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>總覽｜AI 指揮中心</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="app">
<div class="side" id="side"></div>

<div class="main">
<div class="wrap">
  <header class="top">
    <div><h1>總覽</h1><div class="sub" id="sub">數字全部即時計算</div></div>
    <span class="sp"></span>
    <a class="btn sm" href="inbox.html" style="text-decoration:none">前往訊息中心</a>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>客戶分級</h2>
    <div id="gradewrap"><p class="empty">尚無資料</p></div>
  </div>

  <div class="card" id="agentcard" style="display:none">
    <h2>訊息手戰況</h2>
    <table class="list">
      <thead><tr><th>成員</th><th>職務</th><th class="num">負責對話</th><th class="num">待回</th><th class="num">累計回覆</th></tr></thead>
      <tbody id="agrows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>獲客渠道</h2>
    <table class="list">
      <thead><tr><th>來源</th><th class="num">客戶數</th><th>占比</th></tr></thead>
      <tbody id="srows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>最近對話</h2>
    <table class="list">
      <thead><tr><th>客戶</th><th>分級</th><th>負責人</th><th>最後訊息</th><th></th></tr></thead>
      <tbody id="rrows"></tbody>
    </table>
  </div>

  <p class="foot">
    第一階段：全部使用假資料，不連接公司任何正式系統，不使用 LINE API。
  </p>
</div>
</div>

<script src="app.js"></script>
<script>
(async () => {
  const u = await requireLogin();
  if (!u) return;
  const j = await api("/api/dashboard");
  if (!j.ok) return;
  renderSidebar(u, "index.html", { all: j.totals.conversations });

  if (!j.can_see_all) document.getElementById("sub").textContent = "你的範圍：只計算指派給你的對話";

  const t = j.totals;
  document.getElementById("tiles").innerHTML =
    tile(t.conversations, "進行中的對話")
    + tile(t.unassigned, "未指派", t.unassigned > 0 ? "hi" : "")
    + tile(t.unread, "待回覆", t.unread > 0 ? "hi" : "ok")
    + tile(t.messages, "累計訊息");

  const g = j.grades, gt = g.S + g.A + g.B + g.C;
  if (gt > 0) {
    const w = (n) => Math.round(n / gt * 100);
    document.getElementById("gradewrap").innerHTML =
      '<div class="sevbar">'
      + '<i class="s-hi"  style="width:' + w(g.S) + '%"></i>'
      + '<i class="s-mid" style="width:' + w(g.A) + '%"></i>'
      + '<i style="width:' + w(g.B) + '%;background:var(--accent)"></i>'
      + '<i class="s-low" style="width:' + w(g.C) + '%"></i></div>'
      + '<div class="sevkey"><span class="k-hi">■ S <b>' + g.S + "</b></span>"
      + '<span class="k-mid">■ A <b>' + g.A + "</b></span>"
      + '<span style="color:var(--accent)">■ B <b>' + g.B + "</b></span>"
      + '<span class="k-low">■ C <b>' + g.C + "</b></span></div>"
      + '<p style="font-size:12px;color:var(--faint);margin:10px 0 0">'
      + "S／A 是有持續互動的客戶，C 是還沒指派、也還沒往來的。</p>";
  }

  if (j.can_see_all && j.agents.length) {
    document.getElementById("agentcard").style.display = "";
    document.getElementById("agrows").innerHTML = j.agents.map((a) =>
      "<tr><td><b>" + esc(a.name) + "</b></td>"
      + "<td>" + (a.role === "operator" ? "運營" : "訊息手") + "</td>"
      + '<td class="num">' + a.assigned + "</td>"
      + '<td class="num' + (a.unread > 0 ? " hi" : "") + '">' + a.unread + "</td>"
      + '<td class="num">' + a.replies + "</td></tr>").join("");
  }

  const stot = j.sources.reduce((n, s) => n + s.n, 0) || 1;
  const NAME = { meta: "Facebook 廣告", ig: "Instagram", line_search: "LINE 搜尋" };
  document.getElementById("srows").innerHTML = j.sources.length ? j.sources.map((s) =>
    "<tr><td>" + esc(NAME[s.source] || s.source) + '</td><td class="num">' + s.n + "</td>"
    + '<td style="width:44%"><div class="sevbar" style="margin:0"><i style="width:'
    + Math.round(s.n / stot * 100) + '%;background:var(--accent)"></i></div></td></tr>'
  ).join("") : '<tr><td colspan="3" class="empty">尚無資料</td></tr>';

  document.getElementById("rrows").innerHTML = j.recent.length ? j.recent.map((c) =>
    "<tr><td><b>" + esc(c.display_name) + "</b></td>"
    + '<td><span class="gr g-' + esc(c.grade) + '">' + esc(c.grade) + "</span></td>"
    + "<td>" + (c.assigned_to ? esc(c.agent_name) : '<span style="color:var(--mid)">未指派</span>') + "</td>"
    + '<td style="max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    + (c.last_dir === "out" ? "↩ " : "") + esc(c.last_text || "") + "</td>"
    + '<td><a href="inbox.html">開啟 →</a></td></tr>'
  ).join("") : '<tr><td colspan="5" class="empty">還沒有對話。</td></tr>';

  function tile(n, label, cls) {
    return '<div class="tile"><span class="n ' + (cls || "") + '">' + n + '</span><span class="l">' + label + "</span></div>";
  }
})();
</script>
</body>
</html>
